<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2756c5">
<meta property="og:title" content="Cegonha Voadora · Chá de bebê do Bernardo">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 30'%3E%3Cpath d='M3 27V9l10 8 9-14 9 14 10-8v18z' fill='%23f2b632' stroke='%231c2a55' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Cegonha Voadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Dancing+Script:wght@700&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: phone-shaped column; canvas sky over Sorocaba (skyline, landmarks, green neighborhood signs, street) with the stork flying through building/cloud gates; HUD with progress to the Lar do Bernardo on top; cards for start/end. Single "príncipe" look, light only. */
:root{
  --gingham:#bcd3f5; --blue:#2756c5; --blue2:#1b3f9e; --lb:#9dbdf2; --ice:#eef4fe;
  --gold:#f2b632; --ink:#1c2a55; --muted:#4d5f8f; --sign:#0f7a4a;
  --display:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --script:"Dancing Script","Brush Script MT",cursive;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--gingham)}
body{height:100%;margin:0;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(90deg,rgba(255,255,255,.45) 50%,transparent 0) 0 0/36px 36px,linear-gradient(rgba(255,255,255,.45) 50%,transparent 0) 0 0/36px 36px,var(--gingham)}
#app{position:relative;height:100%;width:100%;max-width:480px;margin:0 auto;overflow:hidden;background:#bfdcfb;touch-action:none}
@media (min-width:520px){#app{box-shadow:0 0 0 3px var(--ink),0 18px 50px rgba(28,42,85,.35)}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:8px;left:0;right:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;z-index:2}
.panel{background:rgba(255,255,255,.93);border:2.5px solid var(--ink);border-radius:20px;padding:6px 10px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 rgba(28,42,85,.18)}
.top{display:flex;align-items:center;gap:8px}
.stat{display:flex;align-items:baseline;gap:4px;font-family:var(--display);white-space:nowrap}
.stat b{font-size:1.5rem;line-height:1;font-weight:800;color:var(--blue2);font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;font-weight:600;color:var(--muted)}
.grow{flex:1;min-width:0}
.where{font:800 .78rem var(--body);color:#fff;background:var(--sign);border:2px solid #fff;outline:2px solid var(--sign);border-radius:6px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
#mute{pointer-events:auto;touch-action:manipulation;width:34px;height:34px;border-radius:12px;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;padding:0;cursor:pointer;flex:none}
#mute svg{width:18px;height:18px}
#mute:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.track{position:relative;height:14px;border-radius:99px;background:var(--ice);border:2px solid var(--ink);margin:0 24px 0 4px}
.track i{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;background:repeating-linear-gradient(-45deg,#2f62d0 0 8px,#4d7ee6 8px 16px)}
.track .bird{position:absolute;top:50%;left:0;width:26px;height:20px;transform:translate(-50%,-60%)}
.track .home{position:absolute;top:50%;right:-26px;width:22px;height:22px;transform:translateY(-55%)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-block:14px;z-index:5;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:rgba(28,42,85,.28)}
#overlay.low{align-items:flex-start;background:transparent;pointer-events:none}
#overlay.low .card{pointer-events:auto;padding-block:10px 12px;gap:8px}
.card{position:relative;background:#fff;border:3px solid var(--ink);border-radius:26px;padding:14px 14px 16px;max-width:380px;width:100%;text-align:center;box-shadow:0 7px 0 rgba(28,42,85,.25);display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.card::before{content:"";position:absolute;inset:6px;border:2px dashed #9dbdf2;border-radius:20px;pointer-events:none}
@keyframes pop{from{transform:scale(.85) translateY(24px);opacity:0}to{transform:none;opacity:1}}
.back{align-self:flex-start;position:relative;z-index:1;font:800 .85rem var(--body);color:var(--blue2);text-decoration:none;border:2px solid var(--ink);border-radius:99px;padding:2px 11px;background:var(--ice);margin-bottom:-6px}
.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.crown{width:44px;height:30px;margin:0 auto -4px;display:block}
.card .pre{font-family:var(--script);font-size:1.4rem;color:var(--blue);line-height:1;margin:0}
.card .name{font-family:var(--display);font-weight:800;font-size:2.5rem;line-height:.9;margin:0;color:var(--blue);text-shadow:0 3px 0 #bcd3f5}
.game{align-self:center;font-family:var(--display);font-weight:800;font-size:.92rem;color:#fff;background:var(--blue2);border-radius:99px;padding:3px 14px 1px;letter-spacing:.03em}
.card h1{font-family:var(--display);font-weight:800;font-size:1.85rem;line-height:1.02;margin:2px 0 0;color:var(--blue2);text-wrap:balance}
.card p{margin:0;font-size:.93rem;line-height:1.4;color:var(--muted);text-wrap:pretty}
.signs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.signs span{font:800 .74rem var(--body);color:#fff;background:var(--sign);border:2px solid #fff;outline:2px solid var(--sign);border-radius:5px;padding:0 6px}
.how{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.how div{border:2px solid var(--ink);border-radius:14px;background:var(--ice);padding:7px 6px;font:800 .78rem/1.25 var(--body);color:var(--ink)}
.how b{display:block;font-family:var(--display);font-size:1.05rem;color:var(--blue2);line-height:1.05}
.obs{font-size:.8rem!important}
.big{font-family:var(--display);font-weight:800;color:var(--blue2);font-size:1.05rem}
.big b{font-size:2.3rem;line-height:1;display:block;font-variant-numeric:tabular-nums}
.meterline{height:12px;border-radius:99px;border:2px solid var(--ink);background:var(--ice);overflow:hidden}
.meterline i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#2f62d0 0 8px,#4d7ee6 8px 16px)}
.rec{font-size:.85rem;font-weight:800;color:var(--muted)}
.btns{display:flex;gap:8px}
.btn{flex:1;touch-action:manipulation;font-family:var(--display);font-weight:800;font-size:1.2rem;border:3px solid var(--ink);border-radius:18px;padding:9px 12px;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--ink);cursor:pointer;text-shadow:0 2px 0 rgba(28,42,85,.35)}
a.btn{display:block;text-decoration:none}
.btn.alt{background:#fff;color:var(--blue2);text-shadow:none;font-size:1.02rem}
.btns .btn:first-child{flex:1.3}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (max-height:640px){.card .name{font-size:2.1rem}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="panel">
      <div class="top">
        <div class="stat"><b id="cnt">0</b><span>de 22</span></div>
        <div class="grow"></div>
        <span class="where" id="where">Sorocaba</span>
        <button id="mute" aria-label="Ligar ou desligar o som"></button>
      </div>
      <div class="track"><i id="fill"></i>
        <svg class="bird" id="tbird" viewBox="0 0 26 20"><ellipse cx="11" cy="11" rx="8" ry="5" fill="#fff" stroke="#1c2a55" stroke-width="1.6"/><circle cx="19" cy="6" r="3.5" fill="#fff" stroke="#1c2a55" stroke-width="1.5"/><path d="M22 6l4 1-4 1z" fill="#f39a3d"/><circle cx="21" cy="14" r="3" fill="#9dbdf2" stroke="#1c2a55" stroke-width="1.2"/></svg>
        <svg class="home" viewBox="0 0 22 22"><path d="M3 11L11 3l8 8v9H3z" fill="#fde7ec" stroke="#1c2a55" stroke-width="1.8" stroke-linejoin="round"/><rect x="8.5" y="13" width="5" height="7" fill="#2756c5"/></svg>
      </div>
    </div>
  </div>
  <div id="overlay"><div class="card" id="card"></div></div>
</div>

const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const INK='#3a1f28',NAVY='#1c2a55',BLUE='#2756c5',BLUE2='#1b3f9e',LBLUE='#9dbdf2',GOLD='#f2b632',SIGN='#0f7a4a',BSKIN='#fcd9b8',CAPY='#a8704a';

const FACE={bianca:{ar:293/240,hw:94},bruno:{ar:253/220,hw:98}};
const GOAL=22;
const BAIRROS=['Centro','Campolim','Mato Dentro','Vila Hortência','Brigadeiro Tobias','Wanel Ville','Árvore Grande','Éden','Santa Rosália','Cajuru','Aparecidinha','Jardim Vergueiro'];

/* ---------- helpers ---------- */
function rr(x,y,w,h,r,c=ctx){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function starPath(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath()}
function heartPath(c,x,y,s){y-=s*.5;c.beginPath();c.moveTo(x,y+s*.3);c.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);c.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);c.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);c.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);c.closePath()}
function drawCrown(c,x,y,w){const h=w*.62;c.beginPath();c.moveTo(x-w/2,y);c.lineTo(x-w/2,y-h*.75);c.lineTo(x-w/4,y-h*.35);c.lineTo(x,y-h);c.lineTo(x+w/4,y-h*.35);c.lineTo(x+w/2,y-h*.75);c.lineTo(x+w/2,y);c.closePath();
  c.fillStyle=GOLD;c.fill();c.lineWidth=Math.max(1.5,w*.07);c.strokeStyle=NAVY;c.lineJoin='round';c.stroke();c.fillStyle=BLUE;[[-w/2,-h*.75],[0,-h],[w/2,-h*.75]].forEach(([a,b])=>{c.beginPath();c.arc(x+a,y+b,w*.09,0,7);c.fill()})}
function ell(x,y,rx,ry,fill,stroke=INK,lw=2.5){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,7);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
const lerp=(a,b,k)=>a+(b-a)*k,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
function face(key,who,x,chinY,w,rot=0){const im=IMG[key];if(!im.complete||!im.naturalWidth)return;const h=w*FACE[who].ar;ctx.save();ctx.translate(x,chinY);ctx.rotate(rot);ctx.drawImage(im,-w/2,-h*.9,w,h);ctx.restore()}

/* ---------- layout ---------- */
let W=0,H=0,DPR=1;const LY={};
function resize(){
  DPR=Math.min(2,devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  const ar=$('app').getBoundingClientRect(),hb=$('hud').getBoundingClientRect();
  LY.top=hb.bottom-ar.top+4;LY.sc=clamp(Math.min(W/390,(H-LY.top)/680),.74,1.15);LY.ground=H-62*LY.sc;LY.bx=W*.28;
}

/* ---------- state ---------- */
let state='menu',T=0,last=null,paused=false,shake=0,flash=0,banner=null,best=0,G=null,parts=[],texts=[];
try{best=+localStorage.getItem('cegonha_best')||0}catch(e){}
function newG(){
  const s=LY.sc;G={cam:0,y:(LY.top+LY.ground)/2,vy:0,rot:0,flapT:0,gates:[],flyers:[],nextGate:W*1.15,made:0,passed:0,lastGap:(LY.top+LY.ground)/2,signI:0,time:0,end:null,crashK:'',baby:null,where:'Sorocaba'};
}
function newGame(){newG();parts=[];texts=[];state='ready';$('overlay').hidden=true;$('overlay').classList.remove('low');$('overlay').style.paddingTop='';banner={txt:'Entrega especial!',sub:'Toque para a cegonha bater asas',t:0,d:99};updHud()}
const prog=()=>G?clamp(G.passed/GOAL,0,1):0;
const speedNow=()=>(148+62*prog())*LY.sc;

/* ---------- generation ---------- */
const BOT=['predio','predio','predio','caixa','torre','outdoor','catedral'];
function spawnGates(){
  const s=LY.sc;
  while(G.made<GOAL&&G.nextGate<G.cam+W+120){
    const p=G.made/GOAL,gap=(232-68*p)*s,minY=LY.top+gap/2+26*s,maxY=LY.ground-gap/2-46*s;
    let y=clamp(G.lastGap+rnd(-1,1)*(150*s),minY,maxY);G.lastGap=y;
    const g={x:G.nextGate,w:68*s,y,gap,bot:pick(BOT),seed:Math.random(),col:pick(['#f6c9b0','#cfe0fb','#fbe3a4','#d9f0e1','#f3d1e6','#e8e2d6']),passed:false,sign:BAIRROS[G.signI++%BAIRROS.length]};
    G.gates.push(g);G.made++;
    // capivara flyer between gates
    if(G.made>3&&Math.random()<.5){const k=Math.random()<.5?'asa':'para';const fx=G.nextGate+(250-45*p)*s*.5+34*s;
      G.flyers.push({k,x:fx,y:k==='para'?LY.top+rnd(.05,.35)*(LY.ground-LY.top):LY.top+rnd(.25,.75)*(LY.ground-LY.top),ph:Math.random()*6,vy:k==='para'?rnd(26,40)*s:0,vx:k==='asa'?-rnd(30,55)*s:0})}
    G.nextGate+=(258-48*p)*s;
  }
  if(G.made>=GOAL&&!G.houseX)G.houseX=G.nextGate+40*s;
  G.gates=G.gates.filter(g=>g.x+g.w>G.cam-40);G.flyers=G.flyers.filter(f=>f.x>G.cam-80);
}

/* ---------- update ---------- */
function flap(){if(state==='ready'){state='play';banner=null}if(state!=='play')return;G.vy=-440*LY.sc;G.flapT=.25;sfx.flap()}
function update(dt){
  T+=dt;if(!G)return;const s=LY.sc;
  if(state==='ready'){G.y=(LY.top+LY.ground)/2+Math.sin(T*3)*10*s;G.rot=Math.sin(T*3)*.05}
  if(state==='play'||state==='deliver'){
    const sp=state==='play'?speedNow():Math.max(0,(G.end.v-=G.end.a*dt));G.cam+=sp*dt;G.time+=dt;spawnGates();
    for(const f of G.flyers){f.x+=f.vx*dt;f.ph+=dt;if(f.k==='para'){f.y+=f.vy*dt;if(f.y>LY.ground-90*s)f.vy=-Math.abs(f.vy)*.2}else f.y+=Math.sin(f.ph*2)*20*s*dt}
  }

    else{ctx.lineWidth=2.5;ctx.strokeStyle=NAVY;ctx.beginPath();ctx.moveTo(x+14*s,y0);ctx.lineTo(x+20*s,top+28*s);ctx.moveTo(x+w-14*s,y0);ctx.lineTo(x+w-20*s,top+28*s);ctx.stroke();ctx.fillStyle='#e9eef7';rr(x+4*s,top,w-8*s,30*s,8);ctx.fill();ctx.stroke();ctx.fillStyle=BLUE2;ctx.font=`800 ${Math.round(10*s)}px "Baloo 2"`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SAAE',x+w/2,top+15*s)}}
  if(g.bot==='torre'){const cx=x+w/2;ctx.strokeStyle='#d64550';ctx.lineWidth=4*s;ctx.beginPath();ctx.moveTo(cx-18*s,b);ctx.lineTo(cx,top);ctx.lineTo(cx+18*s,b);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=2;for(let yy=top+20*s;yy<b;yy+=22*s){const k=(yy-top)/(b-top)*18*s;ctx.beginPath();ctx.moveTo(cx-k,yy);ctx.lineTo(cx+k,yy);ctx.stroke()}
    ctx.fillStyle=Math.floor(T*2)%2?'#ff3b3b':'#ffb0b0';ctx.beginPath();ctx.arc(cx,top,5*s,0,7);ctx.fill()}
  if(g.bot==='outdoor'){const cx=x+w/2;ctx.fillStyle='#8f97ad';ctx.fillRect(cx-5*s,top+40*s,10*s,b-top-40*s);ctx.fillStyle='#fff';rr(x-14*s,top,w+28*s,44*s,4);ctx.fill();ctx.stroke();ctx.fillStyle=BLUE2;ctx.font=`800 ${Math.round(10*s)}px "Baloo 2"`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SOROCABA',cx,top+15*s);ctx.fillStyle='#d64550';ctx.font=`800 ${Math.round(8*s)}px Nunito`;ctx.fillText('MANCHESTER PAULISTA',cx,top+30*s)}
  if(g.bot==='catedral'){const cx=x+w/2;ctx.fillStyle='#ece5d3';ctx.fillRect(x+10*s,top+30*s,w-20*s,b-top-30*s);ctx.strokeRect(x+10*s,top+30*s,w-20*s,b-top-30*s);ctx.beginPath();ctx.moveTo(x+6*s,top+30*s);ctx.lineTo(cx,top);ctx.lineTo(x+w-6*s,top+30*s);ctx.closePath();ctx.fill();ctx.stroke();
    ell(cx,top+52*s,9*s,9*s,'#fff3c4',NAVY,2);ctx.fillStyle='#ffd86b';for(let yy=top+76*s;yy<b-30*s;yy+=34*s){ctx.fillRect(cx-6*s,yy,12*s,20*s)}}
}
/* flyers */
function drawCapy(x,y,s,happy){ell(x,y,17*s,11*s,CAPY,NAVY,2);ell(x+14*s,y-5*s,9*s,8*s,CAPY,NAVY,2);ctx.fillStyle='#7a4a2a';ctx.fillRect(x+20*s,y-6*s,5*s,6*s);ctx.fillStyle=NAVY;ctx.beginPath();ctx.arc(x+15*s,y-8*s,1.7*s,0,7);ctx.fill();
  ctx.fillStyle='#7a4a2a';ctx.beginPath();ctx.arc(x+10*s,y-12*s,3*s,0,7);ctx.fill();ctx.fillStyle='#1c2a55';rr(x+9*s,y-12*s,12*s,4*s,2);ctx.fill();ctx.fillStyle='#9fe6ff';ctx.fillRect(x+12*s,y-11*s,3*s,2*s);ctx.fillRect(x+17*s,y-11*s,3*s,2*s)}
function drawFlyer(f){const s=LY.sc,x=f.x-G.cam,y=f.y;if(x<-80||x>W+80)return;
  if(f.k==='asa'){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(f.ph*2)*.08);ctx.fillStyle='#ffef9a';ctx.strokeStyle=NAVY;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-34*s,4*s);ctx.lineTo(0,-10*s);ctx.lineTo(34*s,4*s);ctx.lineTo(0,-2*s);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#e05d5d';ctx.beginPath();ctx.moveTo(-17*s,-3*s);ctx.lineTo(0,-10*s);ctx.lineTo(0,-2*s);ctx.lineTo(-17*s,0);ctx.closePath();ctx.fill();ctx.strokeStyle=NAVY;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-10*s,0);ctx.lineTo(-4*s,14*s);ctx.moveTo(10*s,0);ctx.lineTo(4*s,14*s);ctx.stroke();
    ctx.scale(-1,1);drawCapy(0,20*s,s*.8);ctx.restore();return}
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(f.ph*1.6)*.12);ctx.fillStyle='#fff';ctx.strokeStyle=NAVY;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,-26*s,26*s,Math.PI,0);ctx.quadraticCurveTo(13*s,-22*s,0,-26*s);ctx.quadraticCurveTo(-13*s,-22*s,-26*s,-26*s);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=BLUE;ctx.beginPath();ctx.moveTo(0,-52*s);ctx.quadraticCurveTo(-8*s,-40*s,-9*s,-26*s);ctx.lineTo(9*s,-26*s);ctx.quadraticCurveTo(8*s,-40*s,0,-52*s);ctx.fill();
  ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(-24*s,-26*s);ctx.lineTo(-6*s,6*s);ctx.moveTo(24*s,-26*s);ctx.lineTo(6*s,6*s);ctx.moveTo(0,-26*s);ctx.lineTo(0,4*s);ctx.stroke();ctx.scale(-1,1);drawCapy(0,14*s,s*.8);ctx.restore()}
/* stork + bundle */
function drawBundle(x,y,s,face){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.lineJoin='round';ctx.fillStyle=LBLUE;ctx.strokeStyle=NAVY;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-16,-6);ctx.quadraticCurveTo(-20,16,0,22);ctx.quadraticCurveTo(20,16,16,-6);ctx.quadraticCurveTo(0,-14,-16,-6);ctx.fill();ctx.stroke();
  ell(0,-8,11,10.5,BSKIN,NAVY,2);drawCrown(ctx,0,-16,13);ctx.strokeStyle=INK;ctx.lineWidth=1.8;ctx.lineCap='round';
  if(face==='scared'){ell(-4,-9,1.8,2.4,INK,null);ell(4,-9,1.8,2.4,INK,null);ctx.fillStyle=INK;ctx.beginPath();ctx.ellipse(0,-3,2,2.5,0,0,7);ctx.fill()}
  else{ctx.beginPath();ctx.arc(-4,-9,2.2,Math.PI*1.1,Math.PI*1.9);ctx.stroke();ctx.beginPath();ctx.arc(4,-9,2.2,Math.PI*1.1,Math.PI*1.9);ctx.stroke();ctx.beginPath();ctx.arc(0,-5,2.6,.2,Math.PI-.2);ctx.stroke()}
  ctx.fillStyle='rgba(247,163,180,.8)';ctx.beginPath();ctx.ellipse(-7,-5,2.5,1.7,0,0,7);ctx.ellipse(7,-5,2.5,1.7,0,0,7);ctx.fill();ctx.restore()}
function drawStork(){
  const s=LY.sc,x=LY.bx,y=G.y;const flapUp=G.flapT>0||state==='ready'&&Math.sin(T*10)>0;
  ctx.save();ctx.translate(x,y);ctx.rotate(G.rot);ctx.scale(s*1.15,s*1.15);
  ctx.save();ctx.translate(-2,-6);ctx.rotate(flapUp?-1.2:.2);ell(-16,0,22,8,'#e4e8f4');ctx.restore();
  ctx.strokeStyle='#f39a3d';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-18,5);ctx.lineTo(-38,10);ctx.moveTo(-16,8);ctx.lineTo(-36,16);ctx.stroke();
  ell(0,0,23,12,'#fff');ctx.strokeStyle=INK;ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(13,-5);ctx.quadraticCurveTo(26,-18,22,-28);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=5.5;ctx.stroke();
  ell(24,-31,10,10,'#fff');ctx.fillStyle=INK;ctx.beginPath();ctx.arc(27,-33,2.2,0,7);ctx.fill();ctx.fillStyle='#f7a3b4';ctx.beginPath();ctx.arc(22,-27,3,0,7);ctx.fill();drawCrown(ctx,22,-39,12);
  ctx.fillStyle='#f39a3d';ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(32,-35);ctx.lineTo(52,-29);ctx.lineTo(33,-27);ctx.closePath();ctx.fill();ctx.stroke();
  if(state!=='crash'&&!(state==='deliver'&&G.end.t>2.4)){ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(44,-29);ctx.lineTo(30,14);ctx.moveTo(44,-29);ctx.lineTo(40,14);ctx.stroke();ctx.restore();
    const c=storkCircles()[1];drawBundle(c.x+4*s,c.y,s*1.05,G.vy>380*s?'scared':'happy');ctx.save();ctx.translate(x,y);ctx.rotate(G.rot);ctx.scale(s*1.15,s*1.15)}
  ctx.save();ctx.translate(-2,-4);ctx.rotate(flapUp?-1.5:.5);ell(-16,0,23,9,'#fff');ctx.fillStyle=INK;ctx.beginPath();ctx.ellipse(-33,0,6,5,0,0,7);ctx.fill();ctx.restore();
  ctx.restore();
  if(state==='crash'&&G.baby){const b=G.baby;ctx.strokeStyle=NAVY;ctx.lineWidth=1.3;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y-34*s,24*s,Math.PI,0);ctx.closePath();ctx.fill();ctx.lineWidth=2.5;ctx.stroke();ctx.fillStyle=GOLD;ctx.beginPath();ctx.arc(b.x,b.y-34*s,24*s,Math.PI*1.33,Math.PI*1.66);ctx.lineTo(b.x,b.y-34*s);ctx.fill();
    ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(b.x-22*s,b.y-34*s);ctx.lineTo(b.x-6*s,b.y-10*s);ctx.moveTo(b.x+22*s,b.y-34*s);ctx.lineTo(b.x+6*s,b.y-10*s);ctx.stroke();drawBundle(b.x,b.y,s,'happy');
    ctx.font=`800 ${Math.round(14*s)}px "Baloo 2"`;ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.strokeText('O Bernardo tá bem!',b.x+40*s,b.y-70*s);ctx.fillStyle=BLUE2;ctx.fillText('O Bernardo tá bem!',b.x+40*s,b.y-70*s)}
  if(state==='crash')for(let i=0;i<4;i++){const a=T*6+i*Math.PI/2;ctx.fillStyle=GOLD;ctx.strokeStyle=INK;ctx.lineWidth=1.5;starPath(ctx,x+Math.cos(a)*26*s,y-40*s+Math.sin(a)*8*s,6*s);ctx.fill();ctx.stroke()}
}
/* house at the end */
function drawHouse(){if(!G.houseX)return;const s=LY.sc,x=G.houseX-G.cam-60*s,b=LY.ground-8*s,w=220*s,h=150*s;if(x>W+30)return;
  ctx.fillStyle='#fde7ec';ctx.strokeStyle=NAVY;ctx.lineWidth=3;rr(x,b-h,w,h,8);ctx.fill();ctx.stroke();ctx.fillStyle='#e05d5d';ctx.beginPath();ctx.moveTo(x-14*s,b-h);ctx.lineTo(x+w/2,b-h-74*s);ctx.lineTo(x+w+14*s,b-h);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';rr(x+w/2-70*s,b-h-46*s,140*s,24*s,6);ctx.fill();ctx.stroke();ctx.fillStyle=BLUE2;ctx.font=`800 ${Math.round(14*s)}px "Baloo 2"`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('LAR DO BERNARDO',x+w/2,b-h-33*s);
  ctx.fillStyle='#bfe0f7';rr(x+16*s,b-h+22*s,46*s,40*s,5);ctx.fill();ctx.stroke();rr(x+w-62*s,b-h+22*s,46*s,40*s,5);ctx.fill();ctx.stroke();
  // parents at the door
  const done=G.end&&G.end.t>2.4,jump=done?-Math.abs(Math.sin(T*8))*6*s:0;
  ctx.fillStyle='#6b4a32';rr(x+w/2-30*s,b-80*s,60*s,80*s,5);ctx.fill();ctx.stroke();
  for(const [who,dx,col] of [['bianca',-46,'#ef7a8c'],['bruno',46,'#9a6a43']]){const px=x+w/2+dx*s,py=b+jump;ctx.fillStyle=col;ctx.strokeStyle=INK;ctx.lineWidth=2.5;rr(px-20*s,py-56*s,40*s,56*s,12);ctx.fill();ctx.stroke();
    ctx.lineCap='round';ctx.strokeStyle=INK;ctx.lineWidth=10*s;ctx.beginPath();ctx.moveTo(px+(dx<0?-14:14)*s,py-48*s);ctx.lineTo(px+(dx<0?-30:30)*s,py-(done?96:64)*s);ctx.stroke();ctx.strokeStyle=who==='bianca'?'#ef7a8c':'#f8bb8f';ctx.lineWidth=6.5*s;ctx.stroke();
    face(who==='bianca'?'mh':'bh',who,px,py-50*s,(who==='bianca'?60:62)*s,Math.sin(T*6+dx)*.05)}
  if(done){drawBundle(x+w/2,b-70*s+jump,s*1.3,'happy');ctx.font=`800 ${Math.round(26*s)}px "Baloo 2"`;ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.strokeText('Entregue!',x+w/2,b-h-92*s);ctx.fillStyle=BLUE2;ctx.fillText('Entregue!',x+w/2,b-h-92*s)}}
function drawParts(){for(const p of parts){const a=1-p.t/p.life;ctx.globalAlpha=Math.max(0,a);
  if(p.type==='heart'){ctx.fillStyle=p.col;heartPath(ctx,p.x,p.y,p.s*2.4);ctx.fill()}else if(p.type==='spark'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.col;starPath(ctx,0,0,p.s);ctx.fill();ctx.restore()}
  else if(p.type==='feather'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle='#fff';ctx.strokeStyle=NAVY;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,p.s*1.4,p.s*.5,0,0,7);ctx.fill();ctx.stroke();ctx.restore()}
  else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.col;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s*.5);ctx.restore()}}ctx.globalAlpha=1}
function drawBanner(){if(!banner)return;const bt=banner.t,s=bt<.22?.6+bt/.22*.5:bt>banner.d-.3?1.1-(bt-(banner.d-.3))/.3*.4:1.05+Math.sin(bt*3)*.03;ctx.globalAlpha=bt>banner.d-.3?Math.max(0,(banner.d-bt)/.3):1;
  ctx.save();ctx.translate(W/2,LY.top+(LY.ground-LY.top)*.24);ctx.scale(s,s);ctx.rotate(-.03);const w=Math.min(W-30,330);ctx.fillStyle='#fff';rr(-w/2,-40,w,banner.sub?78:58,22);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=NAVY;ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`800 ${banner.txt.length>18?24:28}px "Baloo 2",system-ui`;ctx.fillStyle=BLUE2;ctx.fillText(banner.txt,0,-9);if(banner.sub){ctx.font='700 15px Nunito,system-ui';ctx.fillStyle='#4d5f8f';ctx.fillText(banner.sub,0,21)}ctx.restore();ctx.globalAlpha=1}

function frame(ts){
  const dt=last==null?0:Math.min(.05,(ts-last)/1000);last=ts;if(!paused)update(dt);
  if(W&&G){ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*14*shake,(Math.random()-.5)*8*shake);const s=LY.sc;
    drawSky();drawLandmarks();
    for(const g of G.gates){const x=g.x-G.cam;if(x>W+60||x<-200*s)continue;greenSign(x-(258*s)/2+20*s,g.sign,s)}
    drawGround();drawHouse();
    for(const g of G.gates){const x=g.x-G.cam;if(x>W+40||x+g.w<-40)continue;drawCloudCol(x,g.w,g.y-g.gap/2,s,g.seed);drawBottom(g,x,s)}
    for(const f of G.flyers)drawFlyer(f);
    drawStork();drawParts();drawBanner();
    if(flash>0){ctx.fillStyle=`rgba(255,255,255,${Math.min(1,flash)})`;ctx.fillRect(0,0,W,H)}ctx.restore()}
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
function press(e){if(e&&e.target&&e.target.closest&&e.target.closest('button,a'))return;audio();flap()}
$('app').addEventListener('pointerdown',e=>{if(!$('overlay').hidden)return;press(e)});
$('app').addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if((e.code==='Space'||e.key==='ArrowUp')&&$('overlay').hidden){e.preventDefault();if(!e.repeat)press()}});
document.addEventListener('visibilitychange',()=>{paused=document.hidden;last=null});

/* ---------- screens ---------- */
const crownSVG=`<svg class="crown" viewBox="0 0 44 30"><path d="M3 27V9l10 8 9-14 9 14 10-8v18z" fill="${GOLD}" stroke="${NAVY}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="3" cy="8" r="2.6" fill="${BLUE}"/><circle cx="22" cy="3" r="2.6" fill="${BLUE}"/><circle cx="41" cy="8" r="2.6" fill="${BLUE}"/></svg>`;
function menu(){state='menu';newG();for(let i=0;i<3;i++)spawnGates();G.cam=0;
  $('overlay').classList.remove('low');$('overlay').hidden=false;
  $('card').innerHTML=`<a class="back" href="index.html">‹ Outros jogos</a>${crownSVG}<p class="pre">Chá de bebê do</p><p class="name">Bernardo</p><span class="game">CEGONHA VOADORA</span>
    <p>A cegonha está trazendo o Bernardo pelos céus de Sorocaba. Leve ele até o Lar do Bernardo passando por 22 bairros!</p>
    <div class="signs"><span>Éden</span><span>Brigadeiro Tobias</span><span>Mato Dentro</span><span>Campolim</span><span>Centro</span></div>
    <div class="how"><div><b>Toque</b>bate as asas</div><div><b>Não toque</b>ela desce</div></div>
    <p class="obs">Passe entre os prédios e as nuvens de chuva. Cuidado com as capivaras de asa-delta e de paraquedas!</p>
    ${best?`<div class="rec">Recorde neste celular: ${best} de 22 bairros</div>`:''}
    <button class="btn" id="go">Voar!</button>`;
  $('go').onclick=e=>{e.stopPropagation();audio();newGame()}}
function showEnd(win){const ov=$('overlay');
  if(win){ov.classList.add('low');ov.style.paddingTop=(LY.top+6)+'px';$('card').innerHTML=`<h1>Bernardo entregue!</h1><p>${Math.round(G.time)} segundos de voo por 22 bairros de Sorocaba. A Bianca e o Bruno receberam o príncipe!</p>
    <div class="btns"><button class="btn" id="again">Voar de novo</button><a class="btn alt" href="index.html">Escolher outro jogo</a></div>`}
  else{ov.classList.remove('low');ov.style.paddingTop='';$('card').innerHTML=`<h1>${CRASH[G.crashK]||'Ops!'}</h1>
    <div class="big"><b>${G.passed}</b>de 22 bairros</div><div class="meterline"><i style="width:${(G.passed/GOAL*100).toFixed(1)}%"></i></div>
    <p>A cegonha caiu em <b>${G.where}</b>, mas o Bernardo desceu de paraquedas e está bem.</p><div class="rec">Recorde neste celular: ${best} de 22 bairros</div>
    <div class="btns"><button class="btn" id="again">Tentar de novo</button><a class="btn alt" href="index.html">Escolher outro jogo</a></div>`}
  ov.hidden=false;$('again').onclick=e=>{e.stopPropagation();audio();newGame()}}
addEventListener('resize',resize);
resize();menu();updHud();requestAnimationFrame(frame);
</script>
