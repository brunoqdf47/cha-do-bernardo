<style>
/* Layout: a phone-shaped column (max 480px) centered on blue gingham; full-height canvas scene inside; floating HUD on top; cards for start and end. Single "príncipe" look from the invitation, light only. */
:root{
  --gingham:#bcd3f5; --sky:#dbe8fb; --blue:#2756c5; --blue2:#1b3f9e; --ice:#eef4fe;
  --gold:#f2b632; --ink:#1c2a55; --card:#ffffff; --muted:#4d5f8f;
  --display:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --script:"Dancing Script","Brush Script MT",cursive;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%;background:var(--gingham)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(90deg,rgba(255,255,255,.45) 50%,transparent 0) 0 0/36px 36px,linear-gradient(rgba(255,255,255,.45) 50%,transparent 0) 0 0/36px 36px,var(--gingham)}
#app{position:relative;height:100%;width:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--sky)}
@media (min-width:520px){#app{box-shadow:0 0 0 3px var(--ink),0 18px 50px rgba(28,42,85,.35)}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:8px;left:0;right:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.panel{background:rgba(255,255,255,.92);border:2.5px solid var(--ink);border-radius:20px;padding:6px 10px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 rgba(28,42,85,.18)}
.top{display:flex;align-items:center;gap:8px}
#avatar{width:30px;height:34px;object-fit:contain}
.wk{display:flex;align-items:baseline;gap:5px;font-family:var(--display);flex:1;min-width:0;white-space:nowrap}
.wk b{font-size:1.55rem;line-height:1;font-weight:800;color:var(--blue2);font-variant-numeric:tabular-nums}
.wk span{font-size:.86rem;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
#lives{display:flex;gap:2px}
#lives svg{width:21px;height:21px}
#mute{pointer-events:auto;touch-action:manipulation;width:34px;height:34px;border-radius:12px;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;padding:0;cursor:pointer;flex:none}
#mute svg{width:18px;height:18px}
#mute:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{position:relative;height:12px;border-radius:99px;background:var(--ice);border:2px solid var(--ink);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(-45deg,#2f62d0 0 8px,#4d7ee6 8px 16px);transition:width .35s cubic-bezier(.3,1.6,.5,1)}
.bar em{position:absolute;top:0;bottom:0;width:2px;background:rgba(28,42,85,.35)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-block:14px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:rgba(28,42,85,.25)}
#overlay.upper{align-items:flex-start;background:transparent;pointer-events:none}
#overlay.upper .card{pointer-events:auto;padding-block:10px 12px;gap:8px}
.card{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:14px 14px 16px;max-width:380px;width:100%;text-align:center;box-shadow:0 7px 0 rgba(28,42,85,.25);display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.card::before{content:"";position:absolute;inset:6px;border:2px dashed #9dbdf2;border-radius:20px;pointer-events:none}
@keyframes pop{from{transform:scale(.85) translateY(24px);opacity:0}to{transform:none;opacity:1}}
.back{align-self:flex-start;position:relative;z-index:1;font:800 .85rem var(--body);color:var(--blue2);text-decoration:none;border:2px solid var(--ink);border-radius:99px;padding:2px 11px;background:var(--ice);margin-bottom:-6px}
.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.crown{width:44px;height:30px;margin:0 auto -4px;display:block}
.card .pre{font-family:var(--script);font-size:1.45rem;color:var(--blue);line-height:1;margin:0}
.card .name{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:.9;margin:0;color:var(--blue);text-shadow:0 3px 0 #bcd3f5}
.game{align-self:center;font-family:var(--display);font-weight:800;font-size:.95rem;color:#fff;background:var(--blue2);border-radius:99px;padding:3px 14px 1px;letter-spacing:.03em}
.card h1{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;margin:2px 0 0;color:var(--blue2);text-wrap:balance}
.card h2{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:2px 0 -2px;color:var(--ink)}
.card p{margin:0;font-size:.93rem;line-height:1.4;color:var(--muted);text-wrap:pretty}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who{touch-action:manipulation;border:3px solid var(--ink);border-radius:20px;background:var(--ice);padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;box-shadow:0 5px 0 var(--ink);font-family:var(--display);color:var(--ink)}
.who img{height:92px;width:auto;max-width:100%;object-fit:contain;transition:transform .2s}
.who small{font-size:.8rem;font-weight:600;color:var(--muted);line-height:1}
.who b{font-size:1.25rem;font-weight:800;line-height:1.1;color:var(--blue2)}
.who.m{background:#fde7ec}
.who:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.who:hover img,.who:focus-visible img{transform:rotate(-6deg) scale(1.05)}
.who:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.legend div{border-radius:14px;padding:6px 9px;border:2px solid var(--ink);display:flex;flex-direction:column;gap:1px}
.legend .g{background:var(--ice)}.legend .b{background:#eef0d8}
.legend b{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.legend span{font-size:1.25rem;line-height:1.3;letter-spacing:1px}
.tiny{font-size:.8rem!important}
.best{font-size:.85rem;font-weight:800;color:var(--muted)}
.btns{display:flex;gap:8px}
.btn{flex:1;touch-action:manipulation;font-family:var(--display);font-weight:800;font-size:1.2rem;border:3px solid var(--ink);border-radius:18px;padding:9px 12px;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--ink);cursor:pointer;text-shadow:0 2px 0 rgba(28,42,85,.35)}
.btns .btn:first-child{flex:1.5}
.btn.alt{background:#fff;color:var(--blue2);text-shadow:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.faces{display:flex;justify-content:center;align-items:flex-end;gap:4px}
.faces img{height:84px;width:auto}
@media (max-height:640px){.who img{height:70px}.card .name{font-size:2.2rem}.legend span{font-size:1.1rem}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.bar i{transition:none}.who img{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="panel">
      <div class="top">
        <img id="avatar" alt="">
        <div class="wk"><b id="wk">0</b><span>de 40 semanas</span></div>
        <div id="lives" aria-label="vidas"></div>
        <button id="mute" aria-label="Ligar ou desligar o som"></button>
      </div>
      <div class="bar"><i id="fill"></i><em style="left:32.5%"></em><em style="left:67.5%"></em></div>
    </div>
  </div>
  <div id="overlay"><div class="card" id="card"></div></div>
</div>

function resize(){
  DPR=Math.min(2,devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  for(const k in stickers)delete stickers[k];
  const ar=$('app').getBoundingClientRect(),hb=$('hud').getBoundingClientRect();
  LY.hud=hb.bottom-ar.top;LY.sc=Math.max(.72,Math.min(1.08,H/780));LY.floor=H-30;LY.fy=H-122;LY.back=LY.fy+18;
  LY.storkY=LY.hud+44;LY.cloudY=LY.hud+(H>640?116:98);LY.signTop=LY.cloudY+46;

/* ---------- helpers ---------- */
function rr(x,y,w,h,r,c=ctx){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function starPath(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath()}
function heartPath(c,x,y,s){y-=s*.5;c.beginPath();c.moveTo(x,y+s*.3);c.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);c.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);c.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);c.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);c.closePath()}
function crownPath(c,x,y,w){const h=w*.62;c.beginPath();c.moveTo(x-w/2,y);c.lineTo(x-w/2,y-h*.75);c.lineTo(x-w/4,y-h*.35);c.lineTo(x,y-h);c.lineTo(x+w/4,y-h*.35);c.lineTo(x+w/2,y-h*.75);c.lineTo(x+w/2,y);c.closePath()}
function drawCrown(c,x,y,w){crownPath(c,x,y,w);c.fillStyle=GOLD;c.fill();c.lineWidth=Math.max(1.5,w*.07);c.strokeStyle=NAVY;c.lineJoin='round';c.stroke();
  c.fillStyle=BLUE;[[-w/2,-w*.47],[0,-w*.62],[w/2,-w*.47]].forEach(([a,b])=>{c.beginPath();c.arc(x+a,y+b,w*.09,0,7);c.fill()});
  c.fillStyle='rgba(255,255,255,.5)';c.fillRect(x-w/2+w*.08,y-w*.16,w*.84,w*.06)}
function ell(x,y,rx,ry,fill,stroke=INK,lw=2.5){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,7);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
const lerp=(a,b,k)=>a+(b-a)*k;

function drawDiaper(x,s){
  x.save();x.scale(s,s);x.lineJoin='round';
  x.beginPath();x.moveTo(-18,-11);x.lineTo(18,-11);x.quadraticCurveTo(16,8,6,15);x.lineTo(-6,15);x.quadraticCurveTo(-16,8,-18,-11);x.closePath();
  x.fillStyle='#fff';x.fill();x.lineWidth=2.4;x.strokeStyle=NAVY;x.stroke();
  rr(-19,-15,38,7,3.5,x);x.fillStyle=LBLUE;x.fill();x.stroke();
  x.fillStyle=BLUE;rr(-22,-12,7,8,2,x);x.fill();x.stroke();rr(15,-12,7,8,2,x);x.fill();x.stroke();
  x.fillStyle='#ef7a8c';heartPath(x,0,3,9);x.fill();
  x.restore();
}
function sticker(e,kind){
  const key=e+kind;if(stickers[key])return stickers[key];
  const S=76,c=document.createElement('canvas');c.width=c.height=Math.round(S*DPR);const x=c.getContext('2d');x.scale(DPR,DPR);x.translate(S/2,S/2);
  const r=29;
  x.fillStyle='rgba(28,42,85,.22)';x.beginPath();x.arc(2,5,r+3,0,7);x.fill();
  x.fillStyle=kind==='bad'?'#eef0d8':kind==='pow'?'#fff6d6':'#fff';x.beginPath();x.arc(0,0,r,0,7);x.fill();
  x.lineWidth=5;x.strokeStyle=kind==='good'?'#2f62d0':kind==='bad'?'#8c9a3c':GOLD;
  if(kind==='bad')x.setLineDash([7,5]);x.stroke();x.setLineDash([]);
  x.lineWidth=2.5;x.strokeStyle=NAVY;x.beginPath();x.arc(0,0,r+3,0,7);x.stroke();
  if(e==='FRALDA')drawDiaper(x,1.05);else{x.font=`34px ${EMO}`;x.textAlign='center';x.textBaseline='middle';x.fillText(e,0,2)}
  return stickers[key]=c;
}

function buildBg(){
  bg=document.createElement('canvas');bg.width=Math.round(W*DPR);bg.height=Math.round(H*DPR);
  const x=bg.getContext('2d');x.scale(DPR,DPR);const fy=LY.fy;
  x.fillStyle='#d4e3fa';x.fillRect(0,0,W,fy);
  x.fillStyle='rgba(255,255,255,.42)';for(let i=0;i<W;i+=32)x.fillRect(i,0,16,fy);for(let j=0;j<fy;j+=32)x.fillRect(0,j,W,16);
  x.fillStyle='rgba(39,86,197,.06)';for(let i=16;i<W;i+=32)for(let j=16;j<fy;j+=32)x.fillRect(i,j,16,16);
  const g=x.createLinearGradient(0,0,0,fy);g.addColorStop(0,'rgba(255,255,255,.25)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,W,fy);
  // wainscot with scallops
  x.fillStyle='#fff';x.fillRect(0,fy-66,W,66);
  x.strokeStyle='rgba(39,86,197,.35)';x.setLineDash([5,5]);x.lineWidth=2;x.strokeRect(8,fy-56,W-16,48);x.setLineDash([]);
  x.fillStyle='#fff';x.strokeStyle=NAVY;x.lineWidth=2;
  for(let i=0;i<W+20;i+=22){x.beginPath();x.arc(i,fy-66,11,Math.PI,0);x.fill();x.stroke()}
  x.fillRect(0,fy-66,W,3);
  // floor
  const f=x.createLinearGradient(0,fy,0,H);f.addColorStop(0,'#efd6b2');f.addColorStop(1,'#e2bf91');x.fillStyle=f;x.fillRect(0,fy,W,H-fy);
  x.fillStyle='rgba(28,42,85,.3)';x.fillRect(0,fy,W,3);
  x.strokeStyle='rgba(140,90,40,.16)';x.lineWidth=1.5;
  for(let yy=fy+24,i=0;yy<H+24;yy+=24,i++){x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke();for(let xx=(i%2)*55;xx<W;xx+=110){x.beginPath();x.moveTo(xx,yy-24);x.lineTo(xx,yy);x.stroke()}}
  const rw=Math.min(W*.46,220);
  x.fillStyle='#a9c6f5';x.beginPath();x.ellipse(W/2,H-40,rw,32,0,0,7);x.fill();x.lineWidth=2.5;x.strokeStyle=NAVY;x.stroke();
  x.setLineDash([6,6]);x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.ellipse(W/2,H-40,rw-9,23,0,0,7);x.stroke();x.setLineDash([]);
}

function actor(ch,x){return{ch,x,tx:x,vx:0,phase:0,jy:0,jv:0,sq:0,tilt:0,spin:0,spinT:0,hopT:0,react:null,rt:0,inv:0,stun:0,happy:0,sad:0,blink:0,blinkT:1+Math.random()*3,mag:0,glow:0,flies:0,dizzy:0,hl:{x:-30,y:-80},hr:{x:30,y:-80},bubble:null,depth:1,wave:0}}
function setupCast(id){
  const other=id==='bianca'?'bruno':'bianca';
  player=actor(CH[id],W/2);partner=actor(CH[other],Math.max(46,W*.15));partner.depth=0;
  $('avatar').src=CH[id].src;$('avatar').alt=CH[id].name;
}
function newGame(id){
  choice=id;try{localStorage.setItem('bernardo_choice',id)}catch(e){}
  setupCast(id);
  st={weeks:0,lives:3,combo:0,caught:0};
  items=[];parts=[];texts=[];flyIns=[];balloons=[];win=null;basket.n=0;basket.last=[];
  stork.drop=.8;stork.dy=0;cloud.drop=2.8;state='play';
  const ov=$('overlay');ov.hidden=true;ov.classList.remove('upper');ov.style.paddingTop='';updHud();
  banner={txt:`Vai, ${CH[id].short}!`,sub:'Arraste o dedo para andar',t:0,d:1.8};
  speak(partner,LINES[partner.ch.id].start,1.8);partner.happy=1;
}
const K=()=>st?Math.min(1,st.weeks/40):0;
const bellyOf=ch=>(ch.type==='mom'&&win&&win.landed)?ch.bMin+4:ch.bMin+K()*(ch.bMax-ch.bMin);

/* ---------- HUD & sound ---------- */
const heartSVG=f=>`<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8 3.3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.5 0 5.8 3.5 4.3 7.2C19.5 16.4 12 21 12 21z" fill="${f?'#2f62d0':'#fff'}" stroke="${NAVY}" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
function updHud(){const w=st?Math.min(40,st.weeks):0;$('wk').textContent=w;$('fill').style.width=(w/40*100)+'%';const l=st?st.lives:3;$('lives').innerHTML=[0,1,2].map(i=>heartSVG(i<l)).join('')}
let muted=false,AC=null;
function drawMute(){$('mute').innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="${NAVY}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="${LBLUE}"/>${muted?'<path d="M17 9l5 6M22 9l-5 6"/>':'<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>'}</svg>`}
$('mute').onclick=()=>{muted=!muted;drawMute()};drawMute();
function tone(f1,f2,dur,type='triangle',vol=.13,delay=0){
  if(muted||!AC)return;const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+dur+.02);
}
const sfx={
  good(){tone(660,880,.1);tone(990,1320,.12,'triangle',.11,.07)},
  bad(){tone(320,80,.4,'square',.06);tone(200,60,.3,'sawtooth',.04,.05)},
  pow(){[523,659,784,1047].forEach((f,i)=>tone(f,f*1.01,.12,'triangle',.1,i*.06))},
  drop(){tone(900,700,.06,'sine',.035)},
  win(){[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,f,.18,'triangle',.12,i*.12))}
};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- spawning & effects ---------- */
function dropFromStork(){
  const k=K(),r=Math.random();let it;
  if(r<.06&&st.lives<3)it={kind:'pow',sub:'life',e:'💙'};
  else if(r<.1)it={kind:'pow',sub:'magnet',e:'⭐'};
  else{const g=GOOD[Math.random()*GOOD.length|0];it={kind:'good',e:g.e,n:g.n}}
  addItem(it,stork.x+stork.dir*44*LY.sc,LY.storkY+12,130+k*110);stork.open=.35;sfx.drop();
}
function dropFromCloud(){const b=BAD[Math.random()*BAD.length|0];addItem({kind:'bad',sub:b.k,e:b.e,m:b.m},cloud.x,cloud.y+22,150+K()*130);cloud.puff=.4}
function addItem(it,x,y,vy){Object.assign(it,{x0:Math.max(34,Math.min(W-34,x)),x,y,vy:vy*LY.sc*(.9+Math.random()*.2),ph:Math.random()*6,rot:0,vr:(Math.random()-.5)*4,t:0,sc:.2});items.push(it)}
function burst(x,y,type,n,col){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=80+Math.random()*180;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(type==='puff'?40:120),t:0,life:type==='puff'?1.1:.9+Math.random()*.4,type,col:col||['#2f62d0',GOLD,'#fff','#9dbdf2'][i%4],s:type==='puff'?6+Math.random()*7:5+Math.random()*5,g:type==='puff'?-60:380,r:Math.random()*6})}}
function say(x,y,txt,col,size=22){texts.push({x,y,txt,col,size,t:0})}
function speak(a,txt,d=1.5){a.bubble={txt,t:0,d}}
const pick=a=>a[Math.random()*a.length|0];

/* ---------- logic ---------- */
function catchGood(it){
  st.combo++;st.caught++;let add=1,msg=it.n;
  if(st.combo%5===0){add=2;msg=`Combo x${st.combo}! +2`}
  const before=st.weeks;st.weeks=Math.min(40,st.weeks+add);
  player.happy=.75;if(player.jy<=0)player.jv=300;player.glow=.6;
  burst(it.x,it.y,'heart',6,'#ef7a8c');burst(it.x,it.y,'spark',7);
  say(it.x,it.y-30,msg,BLUE2,24);
  flyIns.push({e:it.e,kind:it.kind,x:it.x,y:it.y,t:0});
  partner.happy=.9;if(partner.jy<=0)partner.jv=260;if(Math.random()<.4||st.combo%5===0)speak(partner,pick(LINES[partner.ch.id].good));
  sfx.good();updHud();milestone(before,st.weeks);
}
function milestone(a,b){
  const ms=[[13,'2º trimestre!','A barriga está crescendo'],[27,'3º trimestre!','Agora fica mais pesado'],[36,'Reta final!','O Bernardo está chegando']];
  for(const [w,t,s] of ms)if(a<w&&b>=w){banner={txt:t,sub:s,t:0,d:1.8};burst(W/2,H*.42,'spark',24);sfx.pow()}
}
function hitBad(it){
  const p=player;
  if(p.inv>0){burst(it.x,it.y,'puff',5,'rgba(160,190,90,.6)');return}
  st.lives--;st.combo=0;p.react=it.sub;p.rt=1.3;p.inv=1.7;shake=RM?0:.4;
  say(p.x,LY.floor-232*LY.sc,it.m,'#4f6a12',22);sfx.bad();buzz(90);
  if(it.sub==='poop'){p.flies=2.6;p.stun=.5;burst(p.x,LY.floor-150*LY.sc,'puff',6,'rgba(150,190,80,.42)')}
  if(it.sub==='sock'){p.flies=1.6;p.stun=.45;burst(p.x,LY.floor-160*LY.sc,'puff',7,'rgba(150,190,80,.42)')}
  if(it.sub==='lego'){p.hopT=1;p.stun=.95;burst(p.x,LY.floor-20,'star',8,GOLD)}
  if(it.sub==='banana'){p.spinT=.85;p.dizzy=1.8;p.stun=1;p.vx=(Math.random()<.5?-1:1)*320*LY.sc}
  partner.sad=1.3;speak(partner,pick(LINES[partner.ch.id].bad));
  updHud();
  if(st.lives<=0){state='lose';partner.sad=99;setTimeout(()=>speak(partner,LINES[partner.ch.id].lose,3),700);setTimeout(()=>showEnd(false),1400)}
}
function power(it){
  sfx.pow();burst(it.x,it.y,'spark',14,GOLD);
  if(it.sub==='life'){if(st.lives<3){st.lives++;say(it.x,it.y-30,'Vida extra!',BLUE2)}else{st.weeks=Math.min(40,st.weeks+1);say(it.x,it.y-30,'+1 semana',BLUE2)}}
  else{player.mag=6;say(it.x,it.y-30,'Ímã de fofura!','#a8740a')}
  player.happy=.7;partner.happy=.8;updHud();
}

function updActor(a,dt,isPlayer){
  const k=K();
  a.rt=Math.max(0,a.rt-dt);a.inv=Math.max(0,a.inv-dt);a.stun=Math.max(0,a.stun-dt);a.happy=Math.max(0,a.happy-dt);a.sad=Math.max(0,a.sad-dt);
  a.mag=Math.max(0,a.mag-dt);a.glow=Math.max(0,a.glow-dt);a.flies=Math.max(0,a.flies-dt);a.dizzy=Math.max(0,a.dizzy-dt);
  if(a.bubble){a.bubble.t+=dt;if(a.bubble.t>a.bubble.d)a.bubble=null}
  const maxSp=(isPlayer?(a.ch.type==='mom'?520-k*230:520-k*120):260)*LY.sc;
  if(a.stun<=0&&!(state==='lose'&&isPlayer)){const want=Math.max(-maxSp,Math.min(maxSp,(a.tx-a.x)*7));a.vx+=(want-a.vx)*Math.min(1,dt*9)}else a.vx*=Math.pow(.08,dt);
  a.x+=a.vx*dt;if(a.x<38){a.x=38;a.vx=0}if(a.x>W-38){a.x=W-38;a.vx=0}
  const speed=Math.abs(a.vx);a.phase+=dt*(speed>15?7+speed/45:0);
  const tiltT=a.vx/Math.max(1,maxSp)*.1+Math.sin(a.phase)*.11*Math.min(1,speed/110);a.tilt+=(tiltT-a.tilt)*Math.min(1,dt*10);
  if(a.spinT>0){a.spinT-=dt;a.spin=(1-Math.max(0,a.spinT)/.85)*Math.PI*2*(a.vx<0?-1:1);if(a.spinT<=0)a.spin=0}
  if(a.hopT>0){a.hopT-=dt;if(a.jy<=0&&a.jv<=0&&a.hopT>0)a.jv=230}
  if(a.jy>0||a.jv>0){a.jy+=a.jv*dt;a.jv-=1500*dt;if(a.jy<=0){a.jy=0;if(a.jv<-150)a.sq=1;a.jv=0}}
  a.sq=Math.max(0,a.sq-dt*5);
  a.blinkT-=dt;if(a.blinkT<0){a.blink=.13;a.blinkT=2+Math.random()*3}a.blink=Math.max(0,a.blink-dt);
  // hand poses
  const s3=Math.sin(T*3);let L,R;
  if(isPlayer){L={x:-36+s3*2,y:-150};R={x:36-s3*2,y:-150}}
  else{a.wave=Math.max(0,a.wave-dt);if(Math.random()<dt*.15&&state!=='lose')a.wave=1.4;
    L={x:-34,y:-62+s3*2};R=a.wave>0?{x:46,y:-176+Math.sin(T*14)*10}:{x:34,y:-62-s3*2}}
  if(a.happy>0){L={x:-52,y:-196+Math.sin(T*14)*5};R={x:52,y:-196-Math.sin(T*14)*5}}
  if(a.sad>0){L={x:-38,y:-172};R={x:38,y:-172}}
  if(a.rt>0){
    if(a.react==='poop'||a.react==='sock'){L={x:-56,y:-150+Math.sin(T*22)*12};R={x:4,y:-140}}
    if(a.react==='lego'){L={x:-50,y:-178+Math.sin(T*18)*10};R={x:50,y:-170-Math.sin(T*18)*10}}
    if(a.react==='banana'){L={x:-62,y:-118};R={x:62,y:-118}}
  }
  if(state==='lose'&&isPlayer){L={x:-30,y:-100};R={x:30,y:-100}}
  if(a.hold){L=a.hold.l;R=a.hold.r}
  const lf=Math.min(1,dt*14);a.hl.x+=(L.x-a.hl.x)*lf;a.hl.y+=(L.y-a.hl.y)*lf;a.hr.x+=(R.x-a.hr.x)*lf;a.hr.y+=(R.y-a.hr.y)*lf;
}

function update(dt){
  T+=dt;const k=K(),sc=LY.sc,play=state==='play';
  for(const c of clouds){c.x+=c.v*dt;if(c.x>W+120)c.x=-120}
  // stork
  if(!win){const sp=(play?70+k*70:55)*sc;stork.x+=stork.dir*sp*dt;if(stork.x>W-50)stork.dir=-1;if(stork.x<50)stork.dir=1}
  stork.open=Math.max(0,stork.open-dt);
  if(play){stork.drop-=dt;if(stork.drop<=0){dropFromStork();stork.drop=(1.15-k*.55)*(.75+Math.random()*.5)}}
  // cloud
  cloud.t+=dt*(play?1+k*.6:.7);cloud.x=W/2+Math.sin(cloud.t*.55)*(W/2-56)+Math.sin(cloud.t*1.7)*16;cloud.y=LY.cloudY+Math.sin(T*2.2)*4-(win?Math.min(1,win.t)*200:0);cloud.puff=Math.max(0,cloud.puff-dt);
  if(play){cloud.drop-=dt;if(cloud.drop<=0){dropFromCloud();cloud.drop=(2.3-k*1.25)*(.7+Math.random()*.6)}}
  if(!player)return;
  if(state==='menu'&&Math.random()<dt*.45)player.tx=60+Math.random()*(W-120);
  if(state==='menu'&&Math.random()<dt*.25)player.happy=.6;
  if(state!=='win'&&Math.abs(player.x-partner.x)<80*LY.sc){partner.tx=player.x<W/2?W*.68:Math.max(46,W*.16)}
  updActor(player,dt,true);updActor(partner,dt,false);
  if(player.mag>0&&Math.random()<dt*14)parts.push({x:player.x+(Math.random()-.5)*90*sc,y:LY.floor-Math.random()*200*sc,vx:0,vy:-40,t:0,life:.7,type:'spark',col:GOLD,s:4,g:0,r:0});
  // items
  const p=player,b=bellyOf(p.ch),top=LY.floor-p.jy-220*sc,bot=LY.floor-p.jy-30*sc,reach=(34+b*.55)*sc+18;
  for(const it of items){
    it.t+=dt;it.sc=Math.min(1,it.sc+dt*5);it.y+=it.vy*dt;
    if(it.kind!=='bad'&&p.mag>0&&play)it.x0+=(p.x-it.x0)*Math.min(1,dt*2.2);
    it.x=it.kind==='bad'?it.x0+Math.sin(it.t*5+it.ph)*4:it.x0+Math.sin(it.t*2.4+it.ph)*14;it.rot+=it.vr*dt;
    if(play&&!it.done&&Math.abs(it.x-p.x)<reach&&it.y>top&&it.y<bot){it.done=true;if(it.kind==='good')catchGood(it);else if(it.kind==='bad')hitBad(it);else power(it)}
    if(!it.done&&it.y>LY.floor-24){it.done=true;
      if(it.kind==='bad')burst(it.x,LY.floor-20,'puff',6,'rgba(150,170,90,.5)');
      else{burst(it.x,LY.floor-20,'puff',5,'rgba(255,255,255,.85)');if(play&&it.kind==='good')say(it.x,LY.floor-60,'Ops!',NAVY,16)}}
  }
  items=items.filter(i=>!i.done);
  for(const q of parts){q.t+=dt;q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=Math.pow(.4,dt);q.r+=dt*4}
  parts=parts.filter(q=>q.t<q.life);
  texts.forEach(t=>t.t+=dt);texts=texts.filter(t=>t.t<1.3);
  for(const f of flyIns){f.t+=dt*1.9;if(f.t>=1&&!f.done){f.done=true;basket.n++;basket.last.push(f);if(basket.last.length>5)basket.last.shift();basket.bump=1}}
  flyIns=flyIns.filter(f=>!f.done);basket.bump=Math.max(0,basket.bump-dt*3);
  for(const bl of balloons){bl.y-=bl.v*dt;bl.t+=dt}balloons=balloons.filter(bl=>bl.y>-120);
  if(banner){banner.t+=dt;if(banner.t>banner.d)banner=null}
  shake=Math.max(0,shake-dt);
  if(play&&st.weeks>=40)startWin();
  if(win)runWin(dt);
}

/* ---------- birth celebration ---------- */
function startWin(){
  state='win';win={t:0,baby:null,landed:0,shown:false};
  items.forEach(i=>burst(i.x,i.y,'puff',4,'rgba(255,255,255,.85)'));items=[];
  banner={txt:'40 semanas!',sub:'A cegonha está chegando…',t:0,d:2.2};
  player.mag=0;player.inv=0;
  const mom=player.ch.id==='bianca'?player:partner,dad=mom===player?partner:player,gap=48*LY.sc;
  mom.tx=W/2-gap;dad.tx=W/2+gap;speak(partner,'Tô indo, amor!',1.5);
}
function runWin(dt){
  const w=win;w.t+=dt;
  partner.depth=Math.min(1,partner.depth+dt*.9);
  stork.x+=(W/2+stork.dir*-40*LY.sc-stork.x)*Math.min(1,dt*2);stork.dy=Math.min(70*LY.sc,stork.dy+dt*60);
  if(w.t>2&&!w.baby){w.baby={x:stork.x+stork.dir*44*LY.sc,y:LY.storkY+stork.dy+12,vy:0};sfx.drop();stork.open=.5}
  const ty=LY.floor-96*LY.sc;
  if(w.baby&&!w.landed){const bb=w.baby;bb.x+=(W/2-bb.x)*Math.min(1,dt*3);bb.vy+=300*dt;bb.y+=bb.vy*dt;
    if(bb.y>=ty){bb.y=ty;w.landed=w.t;sfx.win();banner={txt:'Bem-vindo, Bernardo!',sub:'O nosso príncipe chegou',t:0,d:999,crown:true};
      for(const a of [player,partner]){a.happy=0;a.jv=280}
      for(let i=0;i<14;i++)balloons.push({x:Math.random()*W,y:H+40+Math.random()*260,v:70+Math.random()*60,col:[BLUE,'#5b8ef0',GOLD,'#fff',LBLUE][i%5],t:Math.random()*6});
      for(let i=0;i<4;i++)setTimeout(()=>{burst(Math.random()*W,H*.4,'heart',10,'#ef7a8c');burst(Math.random()*W,H*.35,'spark',14)},i*220)}}
  if(w.landed){
    w.baby.y=ty+Math.sin(T*2.5)*2;
    for(const a of [player,partner]){const inner=a.x<W/2?1:-1,lx=(W/2-a.x)/actorS(a)-inner*6;
      const hold={x:lx-inner*16,y:-92},up={x:-inner*52,y:-190+Math.sin(T*10+(inner>0?0:2))*8};
      a.hold=inner>0?{l:up,r:hold}:{l:hold,r:up};a.blink=Math.sin(T*.8)>.6?.1:0;a.forceHappy=true}
    if(Math.random()<dt*30)parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*40,vy:60+Math.random()*80,t:0,life:4,type:'conf',col:[BLUE,GOLD,'#fff',LBLUE,'#ef7a8c'][Math.random()*5|0],s:5+Math.random()*4,g:30,r:Math.random()*6});
    if(Math.random()<dt*3)parts.push({x:W/2+(Math.random()-.5)*120,y:LY.floor-170*LY.sc,vx:(Math.random()-.5)*40,vy:-60,t:0,life:1.4,type:'heart',col:'#ef7a8c',s:4+Math.random()*3,g:-20,r:0});
  }
  if(w.landed&&w.t-w.landed>2.4&&!w.shown){w.shown=true;showEnd(true)}
}

/* ---------- rendering ---------- */
function drawClouds(){
  for(const c of clouds){const x=c.x,y=H*c.y+LY.hud*.4,s=c.s*LY.sc;ctx.fillStyle='rgba(255,255,255,.85)';
    [[0,0,22],[22,-10,20],[42,0,18],[20,8,20]].forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(x+a*s,y+b*s,r*s,0,7);ctx.fill()})}
}
function leafBranch(x,y,dir,s){
  ctx.save();ctx.translate(x,y);ctx.scale(dir*s,s);ctx.strokeStyle='#8a5a3a';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-20,-10,-38,-34);ctx.stroke();
  [[-8,-4,.3],[-18,-12,-.6],[-24,-20,.5],[-32,-28,-.7],[-38,-36,.1]].forEach(([a,b,r],i)=>{ctx.save();ctx.translate(a,b);ctx.rotate(r+(i%2?-.9:.9)+Math.sin(T*1.5+i)*.06);
    ctx.fillStyle=i%2?'#2f62d0':'#4a7ae0';ctx.beginPath();ctx.ellipse(0,-8,4.5,9,0,0,7);ctx.fill();ctx.restore()});
  ctx.restore();
}
function drawSign(){
  const s=LY.sc,w=Math.min(W*.66,280)*Math.min(1,s+.1),h=w*.4,cx=W/2,top=LY.signTop,ang=Math.sin(T*1.1)*.022;
  ctx.save();ctx.translate(cx,top-26);
  ctx.fillStyle=GOLD;ctx.strokeStyle=NAVY;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();ctx.stroke();
  ctx.rotate(ang);
  ctx.strokeStyle='#b88a52';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-w*.32,26);ctx.moveTo(0,0);ctx.lineTo(w*.32,26);ctx.stroke();
  ctx.translate(0,26);
  leafBranch(-w/2+6,h*.7,1,1.1*s);leafBranch(w/2-6,h*.7,-1,1.1*s);
  const R=8,step=16;const sc=[];
  for(let x=-w/2;x<=w/2;x+=step){sc.push([x,0],[x,h])}for(let y=step;y<h;y+=step){sc.push([-w/2,y],[w/2,y])}

    ctx.font=`800 ${t.size}px "Baloo 2",system-ui`;ctx.lineJoin='round';ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.strokeText(t.txt,0,0);ctx.fillStyle=t.col;ctx.fillText(t.txt,0,0);ctx.restore()}
  ctx.globalAlpha=1;
  if(banner){const k=Math.min(1,banner.t/Math.min(banner.d,2)),s=banner.t<.22?.6+banner.t/.22*.5:(banner.d<99&&banner.t>banner.d-.3)?1.1-(banner.t-(banner.d-.3))/.3*.4:1.05+Math.sin(banner.t*3)*.03;
    ctx.globalAlpha=(banner.d<99&&banner.t>banner.d-.3)?(banner.d-banner.t)/.3:1;
    const y=banner.crown?(LY.hud+205+LY.floor-250*LY.sc)/2:H*.42;
    ctx.save();ctx.translate(W/2,y);ctx.scale(s,s);ctx.rotate(-.03);
    const w=Math.min(W-30,330);ctx.fillStyle='#fff';rr(-w/2,-44,w,banner.sub?84:64,22);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=NAVY;ctx.stroke();
    ctx.setLineDash([5,4]);ctx.strokeStyle=LBLUE;ctx.lineWidth=2;rr(-w/2+6,-38,w-12,72,17);ctx.stroke();ctx.setLineDash([]);
    if(banner.crown)drawCrown(ctx,0,-44,34);
    ctx.font=`800 ${banner.txt.length>16?27:31}px "Baloo 2",system-ui`;ctx.fillStyle=BLUE2;ctx.fillText(banner.txt,0,-10);
    if(banner.sub){ctx.font='700 15px Nunito,system-ui';ctx.fillStyle='#4d5f8f';ctx.fillText(banner.sub,0,22)}
    ctx.restore();ctx.globalAlpha=1}
}

function frame(ts){
  const dt=last==null?0:Math.min(.05,(ts-last)/1000);last=ts;
  if(!paused)update(dt);
  if(bg&&player){
    ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*14*shake,(Math.random()-.5)*6*shake);
    ctx.drawImage(bg,0,0,W,H);drawClouds();drawSign();drawCloud();drawBalloons();drawBasket();
    const order=partner.depth<1?[partner,player]:[partner,player].sort((a,b)=>a.ch.id<b.ch.id?-1:1);
    drawItems();
    if(win&&win.landed){order.forEach(a=>drawActor(a,'body'));drawBaby(W/2,win.baby.y,1.35*LY.sc);order.forEach(a=>drawActor(a,'hands'));}
    else{order.forEach(a=>drawActor(a));if(win&&win.baby)drawBaby(win.baby.x,win.baby.y,1.1*LY.sc)}
    drawStork();drawParts();drawTexts();
    ctx.restore();
  }
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
function aim(e){if(state!=='play'||!player)return;const r=cv.getBoundingClientRect();player.tx=e.clientX-r.left}
cv.addEventListener('pointerdown',e=>{aim(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')aim(e)});
addEventListener('keydown',e=>{if(state!=='play')return;if(e.key==='ArrowLeft')player.tx=Math.max(38,player.x-110);if(e.key==='ArrowRight')player.tx=Math.min(W-38,player.x+110)});
document.addEventListener('visibilitychange',()=>{paused=document.hidden;last=null});

/* ---------- screens ---------- */
const crownSVG=`<svg class="crown" viewBox="0 0 44 30"><path d="M3 27V9l10 8 9-14 9 14 10-8v18z" fill="${GOLD}" stroke="${NAVY}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="3" cy="8" r="2.6" fill="${BLUE}"/><circle cx="22" cy="3" r="2.6" fill="${BLUE}"/><circle cx="41" cy="8" r="2.6" fill="${BLUE}"/></svg>`;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}}
function bindPick(){document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{audio();newGame(b.dataset.ch)})}
function menu(){
  state='menu';win=null;balloons=[];banner=null;items=[];st=null;updHud();
  setupCast(choice);player.x=player.tx=W/2;
  const ov=$('overlay');ov.classList.remove('upper');ov.style.paddingTop='';ov.hidden=false;
  $('card').innerHTML=`
    <a class="back" href="index.html">‹ Outros jogos</a>
    ${crownSVG}
    <p class="pre">Chá de bebê do</p>
    <p class="name">Bernardo</p>
    <span class="game">ENXOVAL VOADOR</span>
    <p>A cegonha está jogando o enxoval! Pegue as coisas do bebê e fuja da bagunça da nuvem.</p>
    <h2>Quem vai jogar?</h2>
    <div class="pick">
      <button class="who m" data-ch="bianca"><img src="${SRC.mn}" alt=""><small>Mamãe</small><b>Bianca</b></button>
      <button class="who" data-ch="bruno"><img src="${SRC.bn}" alt=""><small>Papai</small><b>Bruno</b></button>
    </div>
    <div class="legend"><div class="g"><b>Pegue</b><span>🍼🧸👑🦆🐣</span></div><div class="b"><b>Fuja da bagunça</b><span>💩🧦🧱🍌</span></div></div>
    <p class="tiny">💙 vida extra · ⭐ ímã de fofura · 5 seguidos valem +2 semanas</p>
    ${best?`<div class="best">Recorde neste celular: ${best} semanas</div>`:''}`;
  bindPick();
}
function showEnd(winner){
  const w=Math.min(40,st.weeks),ch=player.ch;
  if(w>best){best=w;try{localStorage.setItem('bernardo_best',best)}catch(e){}}
  const ov=$('overlay');
  if(winner){ov.classList.add('upper');ov.style.paddingTop=(LY.hud+6)+'px';
    $('card').innerHTML=`<h1>O Bernardo chegou!</h1>
      <p>${ch.name} completou as 40 semanas e encheu o cesto com <b>${basket.n} ${basket.n===1?'mimo':'mimos'}</b>. Tire um print e mostre para os papais!</p>
      <div class="btns"><button class="btn" id="again">Jogar de novo</button><button class="btn alt" id="swap">Trocar</button></div>`}
  else{ov.classList.remove('upper');ov.style.paddingTop='';
    $('card').innerHTML=`<div class="faces"><img src="${SRC.mo}" alt=""><img src="${SRC.bo}" alt=""></div>
      <h1>Que bagunça!</h1>
      <p>${ch.name} chegou a <b>${w} semanas</b>${w>=27?', já no 3º trimestre':w>=13?', já no 2º trimestre':''}. O Bernardo ainda espera!</p>
      <div class="best">Recorde neste celular: ${best} semanas</div>
      <div class="btns"><button class="btn" id="again">Tentar de novo</button><button class="btn alt" id="swap">Trocar</button></div>`}
  ov.hidden=false;$('again').onclick=()=>{audio();newGame(ch.id)};$('swap').onclick=menu;
}

addEventListener('resize',resize);
resize();menu();requestAnimationFrame(frame);
</script>
</body>
